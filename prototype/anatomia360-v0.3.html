<title>Anatomia 360°</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@1,400;1,600&display=swap">
<style>
/* Layout: atlas-style app — fixed side rail (desktop) / bottom tabs (phone); tissue colours follow anatomical-atlas convention (muscle red, nerve yellow, bone ivory, joint/vessel blue). */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eaeeed; --line:#d5dcda;
  --ink:#16222e; --ink-2:#4a5866; --ink-3:#74818c;
  --accent:#1f4e79;            /* navy from the concept doc */
  --accent-soft:#dde7f1;
  --muscle:#b23a48; --muscle-soft:#f6e1e3;
  --nerve:#a87908;  --nerve-soft:#f8ecc9;
  --bone:#8a7550;   --bone-soft:#efe8da;
  --joint:#2b7a8c;  --joint-soft:#dcedf0;
  --good:#2f7d4f; --good-soft:#dff0e5;
  --bad:#b5432f;  --bad-soft:#f7e0da;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-latin:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:14px;
  --grid:rgba(31,78,121,.055);
  --shadow:0 1px 2px rgba(22,34,46,.05),0 10px 28px -14px rgba(22,34,46,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#16202a; --surface-2:#1d2935; --line:#2b3947;
  --ink:#e6edf2; --ink-2:#a9b6c1; --ink-3:#7f8d99;
  --accent:#7fb0e0; --accent-soft:#1b3148;
  --muscle:#e07a85; --muscle-soft:#3a1d22;
  --nerve:#e2b94a; --nerve-soft:#3a2f12;
  --bone:#cdb68c; --bone-soft:#332c1f;
  --joint:#6cc0d2; --joint-soft:#163238;
  --good:#6cc794; --good-soft:#15301f;
  --bad:#ec8a76; --bad-soft:#3a1c16;
  --grid:rgba(127,176,224,.045); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#16202a; --surface-2:#1d2935; --line:#2b3947;
  --ink:#e6edf2; --ink-2:#a9b6c1; --ink-3:#7f8d99;
  --accent:#7fb0e0; --accent-soft:#1b3148;
  --muscle:#e07a85; --muscle-soft:#3a1d22;
  --nerve:#e2b94a; --nerve-soft:#3a2f12;
  --bone:#cdb68c; --bone-soft:#332c1f;
  --joint:#6cc0d2; --joint-soft:#163238;
  --good:#6cc794; --good-soft:#15301f;
  --bad:#ec8a76; --bad-soft:#3a1c16;
  --grid:rgba(127,176,224,.045); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2.25rem;font-weight:800;font-stretch:118%;letter-spacing:-.025em}
h2{font-size:1.35rem;font-weight:700;font-stretch:108%}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.la{font-family:var(--f-latin);font-style:italic}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.tnum{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.brand{display:grid;grid-template-columns:38px 1fr;column-gap:10px;align-items:center;padding:0 6px}
#mark{grid-row:span 2;width:38px;height:38px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.08rem;font-stretch:100%;white-space:nowrap;letter-spacing:-.02em;line-height:1.1}
.brand b span{color:var(--muscle)}
.brand small{font-size:.74rem;color:var(--ink-3);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:.95rem}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px;font-weight:700}
.nav svg{width:18px;height:18px;flex:none}
.due-pill{margin-left:auto;background:var(--muscle);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;font-weight:700}
.rail-foot{margin-top:auto;font-size:.75rem;color:var(--ink-3);padding:0 8px;line-height:1.4}
main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.tabbar{display:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--ink-3);text-decoration:none;font-weight:600;padding:4px 6px;border-radius:8px;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
  .tabbar .due-pill{position:absolute;top:-2px;right:-2px;margin:0;font-size:.62rem;padding:0 5px}
  h1{font-size:1.7rem}
}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.93rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.muscle{background:var(--muscle-soft);color:var(--muscle)}
.chip.nerve{background:var(--nerve-soft);color:var(--nerve)}
.chip.bone{background:var(--bone-soft);color:var(--bone)}
.chip.joint{background:var(--joint-soft);color:var(--joint)}
.chip.official{background:var(--accent-soft);color:var(--accent)}
.chip.suggest{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:600;font-size:.88rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icon-btn{border:0;background:transparent;padding:4px;border-radius:6px;color:var(--ink-3);display:inline-flex}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--nerve)}
.note{font-size:.84rem;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}

/* Trilingual term triplet */
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px}
.tri>div{display:flex;flex-direction:column;min-width:0}
.tri .lbl{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
.tri .v{font-weight:600;overflow-wrap:anywhere}
.tri .v.la{font-weight:400}
@media (max-width:520px){.tri{grid-template-columns:1fr}.tri>div{flex-direction:row;align-items:baseline;gap:8px}.tri .lbl{width:22px;flex:none}}

/* Home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .lead{display:flex;flex-direction:column;gap:12px;justify-content:center}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.pillar{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
a.pillar:hover{border-color:var(--accent)}
.pillar .n{font-family:var(--f-display);font-weight:800;color:var(--ink-3);font-size:.8rem}
.pillar.soon{opacity:.7}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Dictionary */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:1.02rem}
.search svg{width:20px;height:20px;color:var(--ink-3)}
.terms{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.term{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 0;border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.term .stripe{align-self:stretch;border-radius:0 3px 3px 0}
.term .acts{display:flex;gap:2px}
.term mark{background:var(--nerve-soft);color:inherit;border-radius:3px;padding:0 1px}
.term .syn{font-size:.82rem;color:var(--ink-3);margin-top:2px}

/* Module */
.mod-head{display:flex;flex-direction:column;gap:8px}
.layer-body{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.layer-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sheet-btn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.sheet-btn:hover{transform:translateY(-1px)}
.sheet-btn:hover{border-color:var(--ink-3)}
.sheet-btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sheet-btn .la{font-size:1.02rem}
.sheet{display:flex;flex-direction:column;gap:16px}
.fields{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--line)}
.fields dt,.fields dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
.fields dt{font-size:.8rem;font-weight:700;color:var(--ink-3);letter-spacing:.02em;padding-right:12px}
.fields dd{min-width:0}
@media (max-width:560px){.fields{grid-template-columns:1fr}.fields dt{border-bottom:0;padding-bottom:0}}
.rom{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rom figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.rom svg{width:100%;max-width:150px;height:auto}
.rom figcaption{font-size:.84rem}

/* Cranial nerves */
.cn-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.cn:hover{border-color:var(--ink-3)}
.cn[aria-pressed="true"]{border-color:var(--c,var(--nerve));box-shadow:0 0 0 1px var(--c,var(--nerve));background:linear-gradient(160deg,var(--cs,var(--nerve-soft)),var(--surface) 70%)}
.cn .num{font-family:var(--f-display);font-weight:800;font-stretch:120%;font-size:1.6rem;line-height:1.1;color:var(--c,var(--nerve))}
.cn{box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.cn:hover{transform:translateY(-1px)}
.cn .la{font-size:.92rem}
.typekey{display:flex;gap:6px;flex-wrap:wrap}

/* AI tutor */
.tutor{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:10px}
.tutor form{display:flex;gap:8px}
.tutor input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.tutor .ans{white-space:pre-wrap;font-size:.95rem;background:var(--surface);border-radius:8px;padding:12px;border:1px solid var(--line)}
.suggest-q{display:flex;gap:6px;flex-wrap:wrap}
.suggest-q button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:.82rem;color:var(--ink-2)}

/* KI path */
.sem{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.sem:first-of-type{border-top:0}
.sem-h{display:flex;flex-direction:column;gap:2px}
.sem-h b{font-family:var(--f-display);font-size:2.4rem;font-weight:800;font-stretch:120%;line-height:1;color:var(--accent)}
.course{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.course .top{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.course .code{font-family:var(--f-display);font-weight:700;font-size:.8rem;color:var(--ink-3)}
.course ul{margin:0;padding-left:18px;font-size:.9rem;color:var(--ink-2)}
.course a{color:var(--accent);font-weight:600;font-size:.88rem}
@media (max-width:620px){.sem{grid-template-columns:1fr}}

/* Quiz */
.q-card{display:flex;flex-direction:column;gap:14px}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.q-text{font-size:1.15rem;font-weight:600;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--f-display);font-weight:700;color:var(--ink-2);width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.82rem;flex:none}
.opt>span:last-child{padding-top:2px}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .why{display:block;font-size:.86rem;color:var(--ink-2);margin-top:3px}
.feedback{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback h3{font-size:1rem}
.match{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.match .head{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
.match select,.match .fixed{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);min-width:0}
.match .fixed{font-weight:600}
.match select.right{border-color:var(--good);background:var(--good-soft)}
.match select.wrong{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:560px){.match{grid-template-columns:1fr 1fr}.match .c3{grid-column:1/-1}}
.order{display:flex;flex-direction:column;gap:6px}
.order li{list-style:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.order ol{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.order li .lab{flex:1}
.order li.right{border-color:var(--good);background:var(--good-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.timer{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:7px;border-radius:99px;background:var(--surface-2)}
.progress i.ok{background:var(--good)}
.progress i.no{background:var(--bad)}
.progress i.cur{background:var(--accent)}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums}
.topic-row{display:grid;grid-template-columns:160px 1fr 64px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.topic-row:first-child{border-top:0}
@media (max-width:520px){.topic-row{grid-template-columns:1fr 54px}.topic-row .bar{grid-column:1/-1;grid-row:2}}
.sched{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sched div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.sched b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
/* Plates: module headers styled like numbered atlas plates */
.plate{--t:var(--accent);--ts:var(--accent-soft);container-type:inline-size;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--ts) 0%,transparent 58%),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px 28px;box-shadow:var(--shadow)}
.plate.muscle{--t:var(--muscle);--ts:var(--muscle-soft)}
.plate.nerve{--t:var(--nerve);--ts:var(--nerve-soft)}
.plate.joint{--t:var(--joint);--ts:var(--joint-soft)}
.plate.bone{--t:var(--bone);--ts:var(--bone-soft)}
.plate>*{position:relative;z-index:1}
.plate::after{content:attr(data-wm);position:absolute;right:-4px;bottom:-.3em;font-family:var(--f-latin);font-style:italic;font-size:clamp(2rem,10cqi,6rem);line-height:1;color:var(--t);opacity:.1;white-space:nowrap;pointer-events:none;z-index:0}
.plate .eyebrow{color:var(--t)}
.plate .muted{max-width:62ch}
/* Home dial */
.dialcard-wrap{container-type:inline-size}
.dialcard{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}
.dialcard svg{width:100%;max-width:200px;height:auto}
.dial-legend{display:flex;flex-direction:column;gap:8px;font-size:.88rem;min-width:0}
.dial-legend div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.dial-legend i{width:10px;height:10px;border-radius:3px}
@container (max-width:440px){.dialcard{grid-template-columns:1fr;justify-items:center}.dialcard svg{max-width:170px}.dial-legend{width:100%}}
.pillar .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:.95rem;color:var(--pc);background:var(--pcs)}
.pillar{box-shadow:var(--shadow);gap:8px;padding:16px}
.pillars>:nth-child(1){--pc:var(--muscle);--pcs:var(--muscle-soft)}
.pillars>:nth-child(2){--pc:var(--nerve);--pcs:var(--nerve-soft)}
.pillars>:nth-child(3){--pc:var(--accent);--pcs:var(--accent-soft)}
.pillars>:nth-child(4){--pc:var(--joint);--pcs:var(--joint-soft)}

.pillar{transition:transform .15s,border-color .15s}

.sheet{container-type:inline-size}
.facts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
@container (max-width:540px){.facts{grid-template-columns:1fr}}
.fact{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fact .eyebrow{display:flex;align-items:center;gap:6px}
.fact .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.fact p{font-size:.95rem}
/* Bilingual layer */
.langsw{display:flex;flex-direction:column;gap:6px;padding:0 6px}
.langsw .seg{width:100%}
.langsw .seg button{flex:1;padding:6px 6px;font-size:.82rem}
.lang-mobile{display:none}
@media (max-width:820px){.lang-mobile{display:flex;justify-content:flex-end}}
.bi{display:flex;flex-direction:column;gap:3px}
.bi-hu::before,.bi-sv::before{display:inline-block;font-family:var(--f-body);font-style:normal;font-size:.6rem;font-weight:800;letter-spacing:.08em;border-radius:4px;padding:0 4px;margin-right:6px;vertical-align:.12em}
.bi-hu::before{content:"HU";color:var(--muscle);background:var(--muscle-soft)}
.bi-sv::before{content:"SV";color:var(--joint);background:var(--joint-soft)}
.bi-sv{color:var(--ink-2)}
.fields dd .bi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sheet .fields dd .bi{gap:16px}
@container (max-width:560px){.fields dd .bi{grid-template-columns:1fr;gap:4px}}
.q-text .bi-sv{font-size:.95rem;font-weight:500}
.opt .bi-sv,.order .bi-sv{font-size:.9rem}
.bi-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.bi-cols>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.bi-cols>div+div{border-left:1px solid var(--line);padding-left:24px}
@media (max-width:760px){.bi-cols{grid-template-columns:1fr}.bi-cols>div+div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}}
.layer-body:has(.bi-cols){max-width:none}
.lang-tag{align-self:flex-start;font-size:.66rem;font-weight:800;letter-spacing:.08em;border-radius:4px;padding:1px 6px;color:var(--muscle);background:var(--muscle-soft)}
.lang-tag.sv{color:var(--joint);background:var(--joint-soft)}
.h1-sv{font-family:var(--f-display);font-weight:600;font-stretch:110%;font-size:1.15rem;color:var(--joint)}
.h2-sv{font-weight:500;color:var(--ink-3);font-size:.95em}
.nav a .sv{display:block;font-size:.72rem;font-weight:500;color:var(--ink-3);line-height:1.1}
.nav a span.lbl{display:flex;flex-direction:column}
/* Plexus */
.diagram{overflow-x:auto;margin:0 -4px}
.diagram svg{display:block;min-width:640px;width:100%;height:auto}
.px-edge{fill:none;stroke:var(--nerve);stroke-opacity:.28;stroke-width:2.5;transition:stroke-opacity .2s,stroke-width .2s}
.px-edge.post{stroke-dasharray:6 4}
.px-edge.on{stroke-opacity:1;stroke-width:4.5}
.px-edge.les{stroke:var(--bad);stroke-opacity:1;stroke-width:4.5}
.px-node{fill:var(--surface);stroke:var(--nerve);stroke-width:2}
.px-node.on{fill:var(--nerve)}
.px-node.les{fill:var(--bad);stroke:var(--bad)}
.px-lbl{fill:var(--ink-2);font-size:12px;font-family:var(--f-body)}
.px-head{fill:var(--ink-3);font-size:10.5px;font-weight:700;letter-spacing:.08em;font-family:var(--f-body)}
.px-term{cursor:pointer}
.px-term text{fill:var(--ink);font-family:var(--f-latin);font-style:italic;font-size:14px}
.px-term:hover text,.px-term.on text{fill:var(--nerve);font-weight:600}
.px-term:focus-visible{outline:none}
.px-term:focus-visible circle{stroke:var(--accent);stroke-width:3}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2);align-items:center}
.legend svg{width:32px;height:8px;vertical-align:middle}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-family:var(--f-display);font-weight:700;color:var(--nerve);white-space:nowrap}
.lesion{border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const dueList=()=>Q.filter(q=>{const r=srs[q.id];return r&&r.due<=today()});
function grade(id,ok){
  const r=srs[id]||{box:0,due:0,ok:0,no:0};
  if(ok){r.ok++;r.box=Math.min(r.box+1,INTERVALS.length-1)}else{r.no++;r.box=0}
  r.due=today()+(ok?INTERVALS[r.box-1>=0?r.box-1:0]:1)*DAY;
  r.last=Date.now();srs[id]=r;saveSrs();
}

  layers: {
    vall: {
      alap:`<p>Axeln förbinder den övre extremiteten med bålen. Skuldergördeln består av två ben: <span class="la">clavicula</span> (nyckelbenet) och <span class="la">scapula</span> (skulderbladet). Överarmsbenets (<span class="la">humerus</span>) huvud rör sig i skulderbladets grunda ledpanna.</p>
<ul><li>Axelleden är kroppens mest rörliga led, och därför ges dess stabilitet främst av muskler.</li><li>De fyra rotatorkuffmusklerna (supraspinatus, infraspinatus, teres minor, subscapularis) håller humerushuvudet i ledpannan som en "manschett".</li><li>Deltamuskeln ger axeln dess runda form och är den viktigaste lyftmuskeln.</li></ul>`,
      egyetem:`<p>Axelkomplexet består av fyra leder: <span class="la">articulatio glenohumeralis</span>, <span class="la">acromioclavicularis</span>, <span class="la">sternoclavicularis</span> och den funktionella skapulotorakala förbindelsen. Elevationen uppstår genom deras samordnade rörelse (skapulohumeral rytm, ca 2:1).</p>
<ul><li>Rotatorkuffens muskler bildar ett kraftpar med deltamuskeln: deltamuskeln drar humerushuvudet uppåt, kuffen nedåt och inåt, så att huvudet roterar i ledpannan i stället för att glida.</li><li>Rotatorkuffens innervation är C5–C6-dominerad: n. suprascapularis, n. axillaris, nn. subscapulares.</li><li>Kraftparet m. serratus anterior och m. trapezius roterar skulderbladet uppåt; detta krävs för elevation över 90°.</li></ul>`,
      klinika:`<p>Ur fysioterapeutiskt perspektiv kan axelbesvär delas in i tre grupper: smärta och impingement, instabilitet samt rörelseinskränkning.</p>
<ul><li><b>Subakromiell smärta:</b> Hawkins–Kennedy- och Neer-test, smärtsam båge mellan 60° och 120°. Behandling: belastningskontroll, skulderbladskontroll, progressiv styrketräning.</li><li><b>Rotatorkuffruptur:</b> Jobes test, drop arm-test, lag sign-tester.</li><li><b>Adhesiv kapsulit:</b> kapselmönster (utåtrotation &gt; abduktion &gt; inåtrotation).</li><li><b>Nervskador:</b> n. axillaris (svag abduktion), n. thoracicus longus (scapula alata), n. accessorius (hängande axel).</li></ul>
<p class="note">Sammanfattning i utbildningssyfte; ersätter inte professionella riktlinjer eller individuella kliniska beslut.</p>`
    },
    plexus: {
      alap:`<p><span class="la">Plexus brachialis</span> (armplexus) är den nervfläta som försörjer hela den övre extremiteten. Nervrötterna som lämnar ryggmärgens nedre cervikala och första torakala segment (C5–T1) delar sig och förenas upprepade gånger på halsen och i axillen, så att det till slut utgår fem stora nerver mot armen.</p>
<ul><li>Uppbyggd i fem nivåer: rötter → primärsträngar → divisioner → sekundärsträngar → terminalgrenar.</li><li>De fem terminalgrenarna: <span class="la">n. musculocutaneus, n. axillaris, n. radialis, n. medianus, n. ulnaris</span>.</li><li>Sekundärsträngarna namnges efter sitt läge i förhållande till <span class="la">a. axillaris</span>.</li></ul>`,
      egyetem:`<p>Rötterna (<span class="la">radices</span>) kommer ut mellan m. scalenus anterior och medius och förenas till tre primärsträngar (<span class="la">trunci</span>). Varje primärsträng delar sig bakom nyckelbenet i en främre och en bakre division (<span class="la">divisiones</span>). De främre divisionerna ger nerverna till flexorerna, de bakre nerverna till extensorerna.</p>
<ul><li><b>Fasciculus lateralis</b> (C5–C7): främre divisionerna från övre och mellersta primärsträngen → n. musculocutaneus, laterala roten till n. medianus.</li><li><b>Fasciculus medialis</b> (C8–T1): nedre primärsträngens främre division → n. ulnaris, mediala roten till n. medianus.</li><li><b>Fasciculus posterior</b> (C5–T1): alla tre bakre divisionerna → n. axillaris, n. radialis.</li><li>"M"-formen bildas av de två rötterna till n. medianus mellan n. musculocutaneus och n. ulnaris; den är ett orienteringsmärke vid dissektion.</li></ul>`,
      klinika:`<p>Vid den fysioterapeutiska undersökningen måste man skilja mellan rotskada (radikulopati), plexusskada och perifer nervskada. Dermatom, myotom och reflex visar tillsammans lesionens nivå.</p>
<ul><li><b>Rotlesion:</b> ett dermatom och ett myotom är påverkade, ofta med nacksmärta (t.ex. C6-radikulopati: domning i tummen, svag handledsextension, nedsatt brachioradialisreflex).</li><li><b>Plexuslesion:</b> flera rötters eller en primärsträngs område är påverkat (Erb, Klumpke, thoracic outlet).</li><li><b>Perifer nerv:</b> nervens eget hudområde och dess muskler är påverkade, reflexerna är oftast bevarade (t.ex. karpaltunnelsyndrom).</li></ul>
<p class="note">Sammanfattning i utbildningssyfte; ersätter inte professionella riktlinjer eller individuella kliniska beslut.</p>`
    }
  },

  window.claude.use('tts').then(t=>{ttsApi=t}).catch(()=>{});
}
function speak(text,lang){
  if(ttsApi){ttsApi.speak(text,{language:lang}).catch(()=>fallbackSpeak(text,lang));return}
  fallbackSpeak(text,lang);
}
function fallbackSpeak(text,lang){
  try{const u=new SpeechSynthesisUtterance(text);u.lang=lang==='sv'?'sv-SE':'hu-HU';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}

function hl(text,q){
  if(!q)return esc(text);
  const f=fold(text),fq=fold(q),i=f.indexOf(fq);
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function renderDictList(){
  const q=dictState.q.trim(),fq=fold(q);
  const rows=TERMS.filter(t=>(dictState.cat==='all'||t[3]===dictState.cat)&&(!dictState.fav||favs.has(t.id))&&(!fq||[t[0],t[1],t[2],t[4]].some(x=>fold(x).includes(fq))));
  $('#dlist').innerHTML=rows.length?rows.map(t=>`
    <div class="term"><span class="stripe" style="background:${CAT[t[3]].color}"></span>
      <div style="min-width:0">${triRaw(hl(t[0],q),hl(t[1],q),hl(t[2],q))}

      <div class="acts">

      </div></div>`).join(''):`<div class="term"><span></span><p class="muted">${u('Nincs találat erre:','Inga träffar för:')} „${esc(q)}”. ${u('Próbáld a latin vagy a svéd alakot.','Prova den latinska eller ungerska formen.')}</p><span></span></div>`;
}
function bindDict(){
  renderDictList();
  $('#dq').addEventListener('input',e=>{dictState.q=e.target.value;renderDictList()});

}

function romSvg(label,deg){
  // half-dial: 0° at the left horizontal, 180° at the right; arc drawn to scale
  const r=56,cx=70,cy=70,a=Math.PI*(1-deg/180);
  const x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);
  const large=0;
  return `<figure><svg viewBox="0 0 140 92" role="img" aria-label="${esc(label)}: 0–${deg}°">
    <path d="M14 70 A56 56 0 0 1 126 70" fill="none" stroke="var(--surface-2)" stroke-width="10" stroke-linecap="round"/>
    <path d="M14 70 A56 56 0 ${large} 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="var(--joint)" stroke-width="10" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ink-2)" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="var(--ink)"/>
    <text x="${cx}" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)" font-family="Archivo, sans-serif">${deg}°</text>
    <text x="8" y="86" font-size="9" fill="var(--ink-3)">0°</text><text x="114" y="86" font-size="9" fill="var(--ink-3)">180°</text>
  </svg><figcaption>${esc(label)}</figcaption></figure>`;
}

  div:{supA:[335,92],supP:[335,132],midA:[335,184],midP:[335,220],infA:[335,274],infP:[335,312]},
  cord:{lat:[475,122],med:[475,252],post:[475,338]},
  term:{musculocutaneus:[640,82],medianus:[640,187],ulnaris:[640,262],axillaris:[640,322],radialis:[640,372]}
};
const PX_TRUNK_ROOTS={sup:['C5','C6'],mid:['C7'],inf:['C8','T1']};
const PX_CORD_DIVS={lat:['supA','midA'],med:['infA'],post:['supP','midP','infP']};
const PX_LEVELS={musculocutaneus:['C5','C6','C7'],axillaris:['C5','C6'],radialis:['C5','C6','C7','C8','T1'],medianus:['C6','C7','C8','T1'],ulnaris:['C8','T1']};
const PX_CORDS={musculocutaneus:['lat'],medianus:['lat','med'],ulnaris:['med'],axillaris:['post'],radialis:['post']};
const PX_EDGES=[
  ...Object.entries(PX_TRUNK_ROOTS).flatMap(([t,rs])=>rs.map(r=>['root',r,'trunk',t])),
  ...['sup','mid','inf'].flatMap(t=>[['trunk',t,'div',t+'A'],['trunk',t,'div',t+'P']]),
  ...Object.entries(PX_CORD_DIVS).flatMap(([c,ds])=>ds.map(d=>['div',d,'cord',c])),
  ['cord','lat','term','musculocutaneus'],['cord','lat','term','medianus'],['cord','med','term','medianus'],['cord','med','term','ulnaris'],['cord','post','term','axillaris'],['cord','post','term','radialis']
];
const PX_LESIONS={
  erb:{label:'Erb–Duchenne (C5–C6)',roots:['C5','C6'],trunks:['sup'],
    text:'A truncus superior sérülése, többnyire a fej és a váll közötti szög erőltetett növelésekor (szülési sérülés, motoros baleset). Kiesik a deltoideus, a supraspinatus, az infraspinatus, a biceps és a brachialis. Jellegzetes "pincér-borravaló" tartás: a kar addukcióban és befelé forgatva lóg, a könyök nyújtott, az alkar borított. Érzéskiesés a váll és az alkar laterális oldalán; a biceps-reflex csökken.'},
  klumpke:{label:'Klumpke (C8–T1)',roots:['C8','T1'],trunks:['inf'],
    text:'A truncus inferior sérülése, például a kar erőltetett felfelé húzásakor, Pancoast-tumornál vagy nyaki bordánál (thoracic outlet). A kéz kisizmai gyengülnek: karomállás, gyenge ujjterpesztés és finommotorika. Érzéskiesés az alkar és a kéz ulnaris oldalán. Ha a T1 gyök avulsiója a szimpatikus rostokat is érinti, Horner-szindróma (ptosis, miosis) társul hozzá.'}
};
function pxPath(a,b){const [x1,y1]=a,[x2,y2]=b,m=(x1+x2)/2;return `M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}`}
function pxActive(){
  const on={root:new Set(),trunk:new Set(),div:new Set(),cord:new Set(),term:new Set()};
  if(plexLesion){const L=PX_LESIONS[plexLesion];L.roots.forEach(r=>on.root.add(r));L.trunks.forEach(t=>on.trunk.add(t));return on}
  const t=plexSel;if(!PX_LEVELS[t])return on;
  on.term.add(t);PX_LEVELS[t].forEach(r=>on.root.add(r));
  PX_CORDS[t].forEach(c=>{on.cord.add(c);PX_CORD_DIVS[c].forEach(d=>{const tr=d.slice(0,3);if(PX_TRUNK_ROOTS[tr].some(r=>on.root.has(r))){on.div.add(d);on.trunk.add(tr)}})});
  return on;
}
function plexusSvg(){
  const on=pxActive(),cls=plexLesion?'les':'on';
  const edgeOn=(ka,a,kb,b)=>{
    if(plexLesion)return (ka==='root'&&on.root.has(a)&&on.trunk.has(b))||(ka==='trunk'&&on.trunk.has(a));
    return on[ka].has(a)&&on[kb].has(b);
  };
  const heads=[['RADICES',70],['TRUNCI',210],['DIVISIONES',335],['FASCICULI',475],['RAMI TERMINALES',640]];
  const TL={sup:'superior',mid:'medius',inf:'inferior'},CL={lat:'lateralis',med:'medialis',post:'posterior'};
  let g='';
  heads.forEach(([h,x])=>g+=`<text class="px-head" x="${x}" y="34" text-anchor="${x===640?'start':'middle'}" dx="${x===640?-6:0}">${h}</text>`);
  PX_EDGES.forEach(([ka,a,kb,b])=>{const post=(ka==='div'&&a.endsWith('P'))||(kb==='div'&&b.endsWith('P'));
    g+=`<path class="px-edge${post?' post':''}${edgeOn(ka,a,kb,b)?' '+cls:''}" d="${pxPath(PX[ka][a],PX[kb][b])}"/>`});
  Object.entries(PX.root).forEach(([k,[x,y]])=>g+=`<circle class="px-node${on.root.has(k)?' '+cls:''}" cx="${x}" cy="${y}" r="7"/><text class="px-lbl" x="${x-16}" y="${y+4}" text-anchor="end" style="font-weight:700">${k}</text>`);
  Object.entries(PX.trunk).forEach(([k,[x,y]])=>g+=`<circle class="px-node${on.trunk.has(k)?' '+cls:''}" cx="${x}" cy="${y}" r="7"/><text class="px-lbl" x="${x}" y="${y-13}" text-anchor="middle">${TL[k]}</text>`);
  Object.entries(PX.div).forEach(([k,[x,y]])=>g+=`<circle class="px-node${on.div.has(k)?' '+cls:''}" cx="${x}" cy="${y}" r="4.5"/>`);
  Object.entries(PX.cord).forEach(([k,[x,y]])=>g+=`<circle class="px-node${on.cord.has(k)?' '+cls:''}" cx="${x}" cy="${y}" r="7"/><text class="px-lbl" x="${x}" y="${y-13}" text-anchor="middle">${CL[k]}</text>`);
  Object.entries(PX.term).forEach(([k,[x,y]])=>g+=`<g class="px-term${on.term.has(k)?' on':''}" data-t="${k}" role="button" tabindex="0" aria-label="n. ${k} adatlap"><rect x="${x-10}" y="${y-14}" width="160" height="28" fill="transparent"/><circle class="px-node${on.term.has(k)?' on':''}" cx="${x}" cy="${y}" r="7"/><text x="${x+14}" y="${y+5}">n. ${k}</text></g>`);
  return `<svg viewBox="0 0 800 400" role="img" aria-label="${u('A plexus brachialis vázlata: gyökök, törzsek, divisiók, kötegek és végágak','Schema över plexus brachialis: rötter, primärsträngar, divisioner, sekundärsträngar och ändgrenar')}">${g}</svg>`;
}
const PX_ROOTS=[
  ['C5','A váll és a felkar laterális oldala','Vállabductio','Biceps-reflex (C5–C6)'],
  ['C6','Az alkar laterális oldala, hüvelykujj','Könyökflexio, csuklóextensio','Brachioradialis-reflex'],

const PX_LAYERS={
 alap:`<p>A <span class="la">plexus brachialis</span> (karfonat) az az idegfonat, amely a teljes felső végtagot ellátja. A gerincvelő alsó nyaki és első háti szakaszából (C5–T1) kilépő gyökök a nyakon és a hónaljban többször szétválnak és újra egyesülnek, így végül öt nagy ideg indul a kar felé.</p>

<ul><li><b>Fasciculus lateralis</b> (C5–C7): a felső és a középső törzs elülső osztódása → n. musculocutaneus, a n. medianus laterális gyöke.</li><li><b>Fasciculus medialis</b> (C8–T1): az alsó törzs elülső osztódása → n. ulnaris, a n. medianus mediális gyöke.</li><li><b>Fasciculus posterior</b> (C5–T1): mindhárom hátsó osztódás → n. axillaris, n. radialis.</li><li>Az "M" alakot a n. medianus két gyöke adja a n. musculocutaneus és a n. ulnaris között; ez boncoláskor tájékozódási pont.</li></ul>`,
 klinika:`<p>A fizioterápiás vizsgálatban el kell különíteni a gyöki (radiculopathia), a plexus- és a perifériás idegsérülést. A dermatóma, a myotóma és a reflex együtt mutatja meg a lézió szintjét.</p>
<ul><li><b>Gyöki lézió:</b> egy dermatóma és egy myotóma érintett, gyakran nyaki fájdalommal (pl. C6-radiculopathia: hüvelykujj-zsibbadás, gyenge csuklóextensio, csökkent brachioradialis-reflex).</li><li><b>Plexus-lézió:</b> több gyök vagy egy törzs területe érintett (Erb, Klumpke, thoracic outlet).</li><li><b>Perifériás ideg:</b> az ideg saját bőrterülete és izmai érintettek, a reflexek többnyire megtartottak (pl. kéztőalagút).</li></ul>
<p class="note">Oktatási célú összefoglaló; nem helyettesíti a szakmai irányelveket és az egyéni klinikai döntést.</p>`
};

    }
  };

/* --- Quiz --- */
let quizState=null;
function newQuiz(ids,mode){
  return {ids,mode,i:0,res:[],answered:false,start:Date.now(),limit:mode==='vizsga'?ids.length*45:0,order:null,matchOpts:null};
}
function viewQuiz(){
  if(!quizState)return quizStart();
  if(quizState.i>=quizState.ids.length)return quizDone();
  return `<div class="mod-head"><span class="eyebrow">${quizState.mode==='vizsga'?u('Vizsgaszimuláció','Tentasimulering'):quizState.mode==='ism'?u('Ismétlés','Repetition'):u('Gyakorlás','Övning')}</span>
    <div class="row" style="justify-content:space-between"><h1>${u('Kérdés','Fråga')} ${quizState.i+1} / ${quizState.ids.length}</h1>${quizState.limit?`<span class="timer" id="timer"></span>`:''}</div>
    <div class="progress">${quizState.ids.map((_,k)=>`<i class="${k<quizState.res.length?(quizState.res[k]?'ok':'no'):k===quizState.i?'cur':''}"></i>`).join('')}</div></div>
    <div class="card q-card" id="qcard"></div>`;
}
function quizStart(){
  const due=dueList();
  const cnt=t=>Q.filter(q=>q.topic===t).length;
  return `<div class="mod-head plate bone" data-wm="examen"><span class="eyebrow">${u('9. fejezet · Munkafüzet és kvíz','Kapitel 9 · Arbetsbok och quiz')}</span>${H1('Kvíz','Quiz')}
   <p class="muted">${u('Feleletválasztás, igaz–hamis, háromnyelvű párosítás és sorrendbe rendezés. Minden válasz után megtudod, miért helyes, miért hibásak a többi lehetőségek, és melyik adatlaphoz kapcsolódik.','Flerval, sant–falskt, trespråkig matchning och ordningsföljd. Efter varje svar får du veta varför det är rätt, varför de andra alternativen är fel och vilket faktablad frågan hör till.')}</p></div>
   <div class="grid g3">
    <div class="card stack"><span class="eyebrow">${u('Ismétlés','Repetition')}</span><h3>${u('Mai esedékes kérdések','Dagens frågor att repetera')}</h3><p class="small muted">${u('A hibázott és a lejárt kérdések, az ismétlési ütemezés szerint.','Felbesvarade och förfallna frågor enligt repetitionsschemat.')}</p><b style="font-family:var(--f-display);font-size:2rem" class="tnum">${due.length}</b><button class="btn primary" data-start="ism" ${due.length?'':'disabled'}>${u('Ismétlés indítása','Starta repetition')}</button></div>
    <div class="card stack"><span class="eyebrow">${u('Gyakorlás','Övning')}</span><h3>${u('Témakör szerint','Per ämne')}</h3>
      <div class="stack">${Object.entries(TOPICS).map(([k,l])=>`<button class="btn" data-start="gyak" data-topic="${k}">${topicName(k)} <span class="muted tnum" style="margin-left:auto">${cnt(k)}</span></button>`).join('')}</div></div>
    <div class="card stack"><span class="eyebrow">${u('Vizsgaszimuláció','Tentasimulering')}</span><h3>${u('10 kérdés, időre','10 frågor på tid')}</h3><p class="small muted">${u('45 másodperc jut egy kérdésre. A magyarázatokat a végén látod.','45 sekunder per fråga. Förklaringarna visas i slutet.')}</p><button class="btn" data-start="vizsga">${u('Vizsga indítása','Starta tentan')}</button></div>
   </div>`;
}
function bindQuizStart(){
  document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{
    const m=b.dataset.start;let ids;
    if(m==='ism')ids=dueList().map(q=>q.id);
    else if(m==='vizsga')ids=shuffle(Q).slice(0,10).map(q=>q.id);
    else ids=shuffle(Q.filter(q=>q.topic===b.dataset.topic)).map(q=>q.id);
    quizState=newQuiz(ids,m);render();
  });
}
let timerInt=null;
function bindQuiz(){
  if(!quizState){bindQuizStart();return}
  if(quizState.i>=quizState.ids.length){bindDone();return}
  renderQ();
  clearInterval(timerInt);
  if(quizState.limit){
    const tick=()=>{const left=quizState.limit-Math.floor((Date.now()-quizState.start)/1000);const el=$('#timer');if(!el){clearInterval(timerInt);return}
      if(left<=0){clearInterval(timerInt);while(quizState.res.length<quizState.ids.length){grade(quizState.ids[quizState.res.length],false);quizState.res.push(false)}quizState.i=quizState.ids.length;render();return}
      el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};
    tick();timerInt=setInterval(tick,1000);
  }
}
function renderQ(){
  const q=Q.find(x=>x.id===quizState.ids[quizState.i]);
  const exam=quizState.mode==='vizsga';
  const svq=SV.q[q.id]||{};
  let body='';
  if(q.type==='mc'){
    if(!quizState.order)quizState.order=shuffle(q.opts.map((_,k)=>k));
    body=`<div class="opts" id="opts">${quizState.order.map((k,n)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[n]}</span><span>${bi(q.opts[k][0],((svq.opts||[])[k]||[])[0])}<span class="why" hidden></span></span></button>`).join('')}</div>`;
  }else if(q.type==='tf'){
    body=`<div class="opts" id="opts"><button class="opt" data-k="true"><span class="k">I</span><span>${bi('Igaz','Sant')}</span></button><button class="opt" data-k="false"><span class="k">H</span><span>${bi('Hamis','Falskt')}</span></button></div>`;
  }else if(q.type==='match'){
    if(!quizState.matchOpts)quizState.matchOpts=[shuffle([...new Set(q.rows.map(r=>r[1]))]),shuffle([...new Set(q.rows.map(r=>r[2]))])];
    const heads=lang==='sv'?(svq.heads||(q.topic==='agyideg'?['NUMMER','UNGERSKA','SVENSKA']:['UNGERSKA','SVENSKA','LATIN'])):(q.heads||(q.topic==='agyideg'?['SORSZÁM','MAGYAR','SVENSKA']:['MAGYAR','SVENSKA','LATINA']));
    body=`<div class="match" id="match"><span class="head">${heads[0]}</span><span class="head">${heads[1]}</span><span class="head c3">${heads[2]}</span>
      ${q.rows.map((r,ri)=>`<div class="fixed">${esc(r[0])}</div>
        <select id="m${ri}a" aria-label="${esc(r[0])} – ${heads[1]}"><option value="">${u('Válassz…','Välj…')}</option>${quizState.matchOpts[0].map(o=>`<option>${esc(o)}</option>`).join('')}</select>
        <select id="m${ri}b" class="c3" aria-label="${esc(r[0])} – ${heads[2]}"><option value="">${u('Válassz…','Välj…')}</option>${quizState.matchOpts[1].map(o=>`<option>${esc(o)}</option>`).join('')}</select>`).join('')}</div>
      <div class="row"><button class="btn primary" id="check">${u('Ellenőrzés','Kontrollera')}</button></div>`;
  }else if(q.type==='order'){
    if(!quizState.order){do{quizState.order=shuffle(q.items.map((_,k)=>k))}while(quizState.order.every((v,k)=>v===k))}
    body=`<div class="order"><ol id="olist">${quizState.order.map((k,n)=>`<li data-k="${k}"><span class="lab">${bi(q.items[k],(svq.items||[])[k])}</span><button class="icon-btn" data-mv="-1" aria-label="${u('Fel','Upp')}" ${n===0?'disabled':''}>${IC.up}</button><button class="icon-btn" data-mv="1" aria-label="${u('Le','Ned')}" ${n===q.items.length-1?'disabled':''}>${IC.down}</button></li>`).join('')}</ol></div>
      <div class="row"><button class="btn primary" id="check">${u('Ellenőrzés','Kontrollera')}</button></div>`;
  }
  const tl=(lang==='sv'?{mc:'Flerval',tf:'Sant eller falskt',match:'Matchning',order:'Ordningsföljd'}:{mc:'Feleletválasztás',tf:'Igaz vagy hamis',match:'Párosítás',order:'Sorrend'})[q.type];
  $('#qcard').innerHTML=`<div class="q-meta"><span class="chip">${topicName(q.topic)}</span><span class="small muted">${tl}</span></div>
    <div class="q-text">${bi(q.q,svq.q)}</div>${body}<div id="fb"></div>`;

  const finish=(ok)=>{
    quizState.answered=true;grade(q.id,ok);quizState.res.push(ok);
    if(exam){next();return}
    const lk=q.link;
    $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><h3>${ok?lb('Helyes válasz','Rätt svar'):lb('Nem ez a helyes válasz','Inte rätt svar')}</h3><div>${bi(q.exp,svq.exp)}</div>
      <div class="row" style="justify-content:space-between"><span class="small muted">${ok?u('Következő ismétlés: ','Nästa repetition om ')+INTERVALS[Math.max(srs[q.id].box-1,0)]+u(' nap múlva',' dagar'):u('Holnap újra előkerül.','Kommer tillbaka i morgon.')}</span>
      <div class="row">${lk?`<a class="btn ghost" href="${lk[0]}" data-open="${lk[1]}">${u('Tananyag megnyitása','Öppna kursinnehållet')}</a>`:''}<button class="btn primary" id="nextQ">${quizState.i+1<quizState.ids.length?u('Következő kérdés','Nästa fråga'):u('Eredmény','Resultat')}</button></div></div>
      ${!ok?`<div data-needs-ai ${sampleFn?'':'hidden'}><button class="btn" id="explain">${u('Magyarázd el másképp (AI-tanár)','Förklara på ett annat sätt (AI-lärare)')}</button><div class="ans tutor" id="explainOut" hidden style="white-space:pre-wrap"></div></div>`:''}</div>`;
    $('#nextQ').onclick=next;$('#nextQ').focus();
    const op=document.querySelector('[data-open]');if(op)op.onclick=()=>{if(lk[0]==='#vall'&&SHEETS[lk[1]])modState.sheet=lk[1];if(lk[0]==='#agyidegek'&&lk[1])cnSel=lk[1];if(lk[0]==='#plexus'&&SHEETS[lk[1]])plexSel=lk[1]};
    const ex=$('#explain');if(ex)ex.onclick=async()=>{
      const out=$('#explainOut');out.hidden=false;out.textContent=u('Gondolkodom…','Tänker…');ex.disabled=true;
      try{const r=await sampleFn(`Egy gyógytornász-hallgató hibásan válaszolt erre a kérdésre. Magyarázd el másképp, ${lang==='sv'?'svédül':lang==='both'?'magyarul, majd svédül is':'magyarul'}, nyelvenként legfeljebb 120 szóban, sima szövegként, egy szemléletes hasonlattal vagy emlékeztetővel. Add meg a kulcsfogalmak latin és svéd alakját.\nKérdés: ${q.q}\nHelyes magyarázat: ${q.exp}`,{modelTier:'quick',onText:({text})=>{out.textContent=text}});out.textContent=r.text}
      catch(e){out.textContent=u('Nem sikerült választ kapni. Próbáld újra később.','Kunde inte få något svar. Försök igen senare.');ex.disabled=false}};
  };

  if(q.type==='mc'||q.type==='tf'){
    $('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||quizState.answered)return;
      const pick=b.dataset.k;const right=q.type==='mc'?String(q.a):String(q.a);
      document.querySelectorAll('#opts .opt').forEach(o=>{o.disabled=true;
        if(o.dataset.k===right)o.classList.add('right');else if(o===b)o.classList.add('wrong');
        if(q.type==='mc'&&!exam){const w=q.opts[+o.dataset.k][1];const why=o.querySelector('.why');if(w&&(o===b||o.dataset.k!==right)){why.innerHTML=lb('Miért nem:','Varför inte:')+' '+bi(w,((svq.opts||[])[+o.dataset.k]||[])[1]);why.hidden=false}}});
      finish(pick===right)};
  }else if(q.type==='match'){
    $('#check').onclick=()=>{let ok=true;q.rows.forEach((r,ri)=>{[['a',1],['b',2]].forEach(([s,c])=>{const el=$('#m'+ri+s);const good=el.value===r[c];ok=ok&&good;el.classList.add(good?'right':'wrong');el.disabled=true;
        if(!good&&!exam){const o=[...el.options].find(x=>x.value===r[c]);if(o){el.value=r[c];el.title='Helyes: '+r[c]}}})});
      $('#check').remove();finish(ok)};
  }else if(q.type==='order'){
    $('#olist').onclick=e=>{const b=e.target.closest('[data-mv]');if(!b)return;const li=b.closest('li');const idx=[...li.parentNode.children].indexOf(li);const j=idx+(+b.dataset.mv);
      const o=quizState.order;[o[idx],o[j]]=[o[j],o[idx]];renderQ()};
    $('#check').onclick=()=>{let ok=true;[...$('#olist').children].forEach((li,n)=>{const g=+li.dataset.k===n;ok=ok&&g;li.classList.add(g?'right':'wrong');li.querySelectorAll('button').forEach(x=>x.disabled=true)});
      if(!ok&&!exam){const p=document.createElement('p');p.className='small';p.textContent='Helyes sorrend: '+q.items.map(x=>x.split(' (')[0]).join(' → ');$('#olist').after(p)}
      $('#check').remove();finish(ok)};
  }
}
function next(){quizState.i++;quizState.answered=false;quizState.order=null;quizState.matchOpts=null;render()}
function quizDone(){

  const n=quizState.res.length,ok=quizState.res.filter(Boolean).length,pct=n?Math.round(ok/n*100):0;

    ${ranked.length?`<p class="small muted">${u('Fejlesztendő:','Att förbättra:')} <b>${ranked[0][0]}</b>${ranked.length>1?` · ${u('Legerősebb:','Starkast:')} <b>${ranked[ranked.length-1][0]}</b>`:''}</p>`:''}</section>
   <section class="card stack"><h2>${lb('Ismétlési dobozok','Repetitionsnivåer')}</h2><div class="sched">${INTERVALS.map((d,i)=>`<div><b>${rs.filter(([,r])=>r.box===i).length}</b><span class="small muted">${i===0?u('új / hibás','ny / fel'):d+u(' nap',' dagar')}</span></div>`).join('')}</div></section>
   <div class="row"><button class="btn" id="reset">${u('Előrehaladás törlése','Radera framsteg')}</button><span class="small muted" id="resetMsg"></span></div>`;
}
function bindStats(){
  const b=$('#reset');let armed=false;
  b.onclick=()=>{if(!armed){armed=true;b.textContent=u('Biztosan törlöd? Kattints újra','Är du säker? Klicka igen');$('#resetMsg').textContent=u('Ez a kvízeredményeket és a kedvenceket is törli ebben a böngészőben.','Detta raderar även quizresultat och favoriter i den här webbläsaren.');return}
    srs={};saveSrs();favs=new Set();store.set('favs',[]);render()};
}

const VIEWS={attekintes:[viewHome],szotar:[viewDict,bindDict],vall:[viewShoulder,bindShoulder],plexus:[viewPlexus,bindPlexus],agyidegek:[viewCN,bindCN],'ki-utvonal':[viewKI],kviz:[viewQuiz,bindQuiz],statisztika:[viewStats,bindStats]};

  if(key!=='kviz')clearInterval(timerInt);
  // an answered question is finished: move on instead of showing it locked
  if(key==='kviz'&&quizState&&quizState.answered){quizState.i++;quizState.answered=false;quizState.order=null;quizState.matchOpts=null}
  renderNav(key);
  $('#view').innerHTML=`<div class="lang-mobile"><div class="seg">${langSwitch()}</div></div>`+VIEWS[key][0]();
  if(VIEWS[key][1])VIEWS[key][1]();
  if(srs._example&&Object.keys(srs).length>1){}
}

const _grade=grade;
grade=function(id,ok){if(srs._example){srs={}}_grade(id,ok)};
let lastKey=null;
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();
